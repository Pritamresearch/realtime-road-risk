# Pre-declared grid for the offline evaluation (written 2026-11-03 before any variant was scored on the cache).
# Data: the 242 annotated own-clip frames (8 clips, 142 with boxes, 100 "nothing safety-critical"), one annotator.
# Selection: leave-one-clip-out (LOCO), criterion = per-clip-mean top-1 hit on the other 7 clips (as v1's own_loco.py);
# ties go to the first config in grid order. Reported: held-out top-1 (pooled over boxed frames, as v1), two-stage bootstrap
# 95% intervals (clips, then frames; 2,000 draws; seed 0), and frame-level AUROC (boxed vs nothing-critical frames).
# Not tuned: camera FOV (65 deg landscape / 45 deg portrait), ego masks, corridor zone thresholds, display settings.

grid:
  source: [seg, yolo]                 # obstacle candidates: SegFormer connected components | YOLO26s-seg instances
  yolo_conf: [0.25, 0.15]             # yolo only
  classes: [paper, road_users]        # paper = v1's class set; road_users = paper + truck (v1: trucks raise the ceiling)
  rule: [corridor, field]             # corridor: nearest in-corridor obstacle; field: argmax w * exp(-d/lambda) * lateral(gap)
  field_lambda_m: [10, 20, 40]
  field_sigma_m: [1, 3, .inf]         # lateral fall-off outside the corridor; inf = distance only
  dist_q: [10, 50]                    # percentile of an object's depths used as its distance

class_sets:                           # weight per class name (v1 weights)
  paper: {person: 1.3, car: 1.2, bicycle: 1.1, motorcycle: 1.1, bus: 1.0, cat: 0.5, dog: 0.5, rider: 1.1}
  road_users: {person: 1.3, car: 1.2, truck: 1.2, bicycle: 1.1, motorcycle: 1.1, bus: 1.0, cat: 0.5, dog: 0.5, rider: 1.1}

# Fixed references, scored without selection
baselines:
  - {name: v1 box height (YOLO 0.25, paper set), kind: box_height}
  - {name: v1 box bottom (YOLO 0.25, paper set), kind: box_bottom}
  - {name: v1 semantic only (YOLO 0.25, paper set), kind: semantic}
  - {name: previous realtime (seg, corridor, q=1), kind: previous}

iou_threshold: 0.5
n_boot: 2000
seed: 0
